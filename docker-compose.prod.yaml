---

services:
  migrate:
    image: ${CINEMA_IMAGE:?set CINEMA_IMAGE to an immutable image digest}
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      MIGRATIONS_DIR: /app/migrations
    read_only: true
    user: "65532:65532"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"

  app:
    image: ${CINEMA_IMAGE:?set CINEMA_IMAGE to an immutable image digest}
    init: true
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR:?set REDIS_ADDR}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_TLS_ENABLED: "true"
      REDIS_TLS_SERVER_NAME: ${REDIS_TLS_SERVER_NAME:-}
      COOKIE_SECURE: "true"
      REQUIRE_HTTPS: "true"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?set TRUSTED_PROXY_CIDRS}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:?set RAZORPAY_WEBHOOK_SECRET}
      TICKET_SIGNING_SECRET: ${TICKET_SIGNING_SECRET:?set TICKET_SIGNING_SECRET}
      SCANNER_API_KEY: ${SCANNER_API_KEY:?set SCANNER_API_KEY}
      VERIFICATION_SECRET: ${VERIFICATION_SECRET:?set VERIFICATION_SECRET}
      METRICS_ENABLED: "true"
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      NOTIFICATION_LOG_ONLY: "false"
      SMTP_ADDR: ${SMTP_ADDR:?set SMTP_ADDR}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_API_TOKEN: ${SMS_API_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    user: "65532:65532"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      migrate:
        condition: service_completed_successfully
