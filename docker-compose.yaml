---

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema-local-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine3.21
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-cinema-redis-local-only}", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "900", "1", "--save", "300", "10", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cinema-redis-local-only}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-commander:
    profiles: ["debug"]
    image: ghcr.io/joeferner/redis-commander:0.9.1
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-cinema-redis-local-only}
      HTTP_USER: ${REDIS_COMMANDER_USER:-admin}
      HTTP_PASSWORD: ${REDIS_COMMANDER_PASSWORD:-change-me-before-use}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on: [redis]

  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://cinema:cinema-local-only@postgres:5432/cinema?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-cinema-api}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      # Keep the listener aligned with the published container port.
      HTTP_ADDR: :8080
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-20s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      # Certificate paths must refer to files mounted inside the container.
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-8760h}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      DATABASE_URL: postgres://cinema:cinema-local-only@postgres:5432/cinema?sslmode=disable
      # Use the bundled Redis service; localhost would target the app container.
      REDIS_ADDR: redis:6379
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cinema-redis-local-only}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-20}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-2}
      # Enabling TLS also requires configuring Redis and mounting certificates.
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      REDIS_TLS_SERVER_NAME: ${REDIS_TLS_SERVER_NAME:-}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-}
      REDIS_TLS_CERT_FILE: ${REDIS_TLS_CERT_FILE:-}
      REDIS_TLS_KEY_FILE: ${REDIS_TLS_KEY_FILE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_replace_me}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-replace_me}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-replace_me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      TICKET_SIGNING_SECRET: ${TICKET_SIGNING_SECRET:-local-ticket-signing-secret-change-in-production}
      SCANNER_API_KEY: ${SCANNER_API_KEY:-local-scanner-api-key-change-me}
      VERIFICATION_SECRET: ${VERIFICATION_SECRET:-local-verification-secret-change-in-production}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      NOTIFICATION_LOG_ONLY: ${NOTIFICATION_LOG_ONLY:-true}
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_API_TOKEN: ${SMS_API_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
