---

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema-local-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-commander:
    profiles: ["debug"]
    image: ghcr.io/joeferner/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "127.0.0.1:8081:8081"
    depends_on: [redis]

  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://cinema:cinema-local-only@postgres:5432/cinema?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://cinema:cinema-local-only@postgres:5432/cinema?sslmode=disable
      REDIS_ADDR: redis:6379
      COOKIE_SECURE: "false"
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_replace_me}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-replace_me}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-replace_me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      TICKET_SIGNING_SECRET: ${TICKET_SIGNING_SECRET:-local-ticket-signing-secret-change-in-production}
      SCANNER_API_KEY: ${SCANNER_API_KEY:-local-scanner-api-key-change-me}
      NOTIFICATION_LOG_ONLY: ${NOTIFICATION_LOG_ONLY:-true}
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_API_TOKEN: ${SMS_API_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
