<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cinema Booking</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f12;
        --panel: #171a20;
        --line: #2c313a;
        --text: #eef1f5;
        --muted: #9299a6;
        --brand: #65d1ff;
        --ok: #3ccc82;
        --warn: #e9ad43;
        --busy: #c75656;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px system-ui,
          sans-serif;
      }
      main {
        width: min(1000px, calc(100% - 32px));
        margin: 36px auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 18px;
      }
      .hidden {
        display: none !important;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      input,
      select,
      button {
        border-radius: 7px;
        border: 1px solid var(--line);
        padding: 10px 12px;
        font: inherit;
      }
      input {
        background: #101318;
        color: var(--text);
        min-width: 220px;
      }
      select {
        background: #101318;
        color: var(--text);
      }
      button {
        background: #252a33;
        color: var(--text);
        cursor: pointer;
      }
      button.primary {
        background: var(--brand);
        color: #06141b;
        border: 0;
        font-weight: 700;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .muted {
        color: var(--muted);
      }
      #screenings {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
      }
      .screening {
        text-align: left;
        padding: 16px;
      }
      .screening.selected {
        outline: 2px solid var(--brand);
      }
      #seats {
        display: grid;
        grid-template-columns: repeat(8, minmax(42px, 1fr));
        gap: 9px;
        max-width: 600px;
        margin: 20px auto;
      }
      .seat {
        min-width: 0;
        padding: 11px 4px;
      }
      .seat.selected {
        background: var(--brand);
        color: #06141b;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 2px;
      }
      .filters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      .filters label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }
      .filters input,
      .filters select {
        width: 100%;
        min-width: 0;
      }
      .seat.held,
      .seat.payment_pending {
        background: var(--warn);
        color: #111;
      }
      .seat.confirmed {
        background: var(--busy);
      }
      #message {
        min-height: 24px;
        margin: 12px 0;
      }
      .error {
        color: #ff8181;
      }
      .success {
        color: var(--ok);
      }
      .summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
      }
      .screen {
        height: 4px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--brand),
          transparent
        );
        margin: 16px auto 30px;
        max-width: 650px;
      }
      h1,
      h2,
      p {
        margin-top: 0;
      }
      @media (max-width: 600px) {
        #seats {
          grid-template-columns: repeat(4, 1fr);
        }
        .summary {
          align-items: flex-start;
          flex-direction: column;
        }
        main {
          width: min(100% - 20px, 1000px);
          margin-top: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Cinema Booking</h1>
        <div id="identity" class="muted">Not signed in</div>
      </header>
      <section id="auth" class="panel">
        <h2>Sign in</h2>
        <p class="muted">
          Create an account or use an existing one. Passwords must contain 12–72
          characters.
        </p>
        <form id="authForm" class="row">
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="Email"
            required
          /><input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
            minlength="12"
            maxlength="72"
            required
          /><button class="primary" data-action="login">Sign in</button
          ><button data-action="register">Create account</button>
        </form>
      </section>
      <section class="panel">
        <h2>Upcoming screenings</h2>
        <form id="filters" class="filters" role="search">
          <label>Movie<input id="movieFilter" type="search" placeholder="Search title" /></label>
          <label>City<input id="cityFilter" type="search" placeholder="Bengaluru" /></label>
          <label>Date<input id="dateFilter" type="date" /></label>
          <label>Language<input id="languageFilter" type="search" placeholder="English" /></label>
          <label>Format<select id="formatFilter"><option value="">All formats</option><option value="2D">2D</option><option value="3D">3D</option><option value="IMAX">IMAX</option></select></label>
          <div class="row">
            <button class="primary" type="submit">Apply filters</button>
            <button type="reset">Clear</button>
          </div>
        </form>
        <div id="screenings" aria-live="polite" aria-busy="false"></div>
      </section>
      <section id="booking" class="panel hidden">
        <h2 id="screeningTitle">Choose seats</h2>
        <div class="screen"></div>
        <div id="seats" role="group" aria-label="Choose seats"></div>
        <div class="summary">
          <div>
            <strong id="selection">No seats selected</strong>
            <div id="price" class="muted"></div>
          </div>
          <button id="checkout" class="primary" disabled>
            Hold seats &amp; pay
          </button>
        </div>
      </section>
      <div id="message" role="status" aria-live="polite"></div>
    </main>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="/app.js?v=priority1-catalog-1" defer></script>
  </body>
</html>
