apiVersion: batch/v1
kind: Job
metadata:
  name: cinema-migrate
  namespace: cinema
  labels:
    app.kubernetes.io/name: cinema-api
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cinema-api
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: cinema-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: cinema-api:replace-with-immutable-digest
          command: ["/app/migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cinema-secrets
                  key: DATABASE_URL
            - name: MIGRATIONS_DIR
              value: /app/migrations
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
