apiVersion: v1
kind: Secret
metadata:
  name: cinema-secrets
  namespace: cinema
type: Opaque
stringData:
  DATABASE_URL: postgres://USER:PASSWORD@PRIVATE_HOST:5432/cinema?sslmode=verify-full
  REDIS_ADDR: PRIVATE_REDIS_HOST:6379
  REDIS_USERNAME: cinema-api
  REDIS_PASSWORD: GENERATE_AT_LEAST_24_RANDOM_CHARACTERS
  REDIS_TLS_SERVER_NAME: PRIVATE_REDIS_HOST
  PUBLIC_BASE_URL: https://cinema.example.com
  CORS_ALLOWED_ORIGINS: https://cinema.example.com
  TRUSTED_PROXY_CIDRS: 10.0.0.0/8
  RAZORPAY_KEY_ID: rzp_live_REPLACE
  RAZORPAY_KEY_SECRET: REPLACE
  RAZORPAY_WEBHOOK_SECRET: REPLACE
  TICKET_SIGNING_SECRET: GENERATE_AT_LEAST_32_RANDOM_CHARACTERS
  SCANNER_API_KEY: GENERATE_AT_LEAST_24_RANDOM_CHARACTERS
  VERIFICATION_SECRET: GENERATE_A_DIFFERENT_32_CHARACTER_SECRET
  METRICS_TOKEN: GENERATE_AT_LEAST_24_RANDOM_CHARACTERS
  SMTP_ADDR: smtp.example.com:587
  SMTP_USERNAME: REPLACE
  SMTP_PASSWORD: REPLACE
  SMTP_FROM: tickets@example.com
  SMS_WEBHOOK_URL: ""
  SMS_API_TOKEN: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: https://otel-collector.observability.svc:4318
