name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, test, race, and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.9
          check-latest: true
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -coverprofile=coverage.out ./...
      - name: Race tests
        run: go test -race ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2 ./...
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@2.64.1 lint static/openapi.yaml

  vulnerabilities:
    name: Go vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: 1.27.2
          go-package: ./...

  container:
    name: Build and scan container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: cinema-ticket-booking:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cinema-ticket-booking:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          version: v0.74.0
