name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, test, race, and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.10
          check-latest: true
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -coverprofile=coverage.out ./...
      - name: Race tests
        run: go test -race ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2 ./...
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@2.64.1 lint static/openapi.yaml

  vulnerabilities:
    name: Go vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: 1.27.3
          go-package: ./...

  container:
    name: Build and scan container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: cinema-ticket-booking:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cinema-ticket-booking:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          version: v0.74.0

  selenium:
    name: Browser workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: qa/selenium/pom.xml
      - name: Start isolated test stack
        run: docker compose up --build -d
      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Run headless Chromium suite
        working-directory: qa/selenium
        run: |
          CHROMIUM_BIN="$(command -v chromium)"
          mvn --batch-mode test -Dheadless=true -Dchrome.binary="$CHROMIUM_BIN" -DbaseUrl=http://localhost:8080 -DscannerKey=local-scanner-api-key-change-me
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failures
          path: |
            qa/selenium/target/failure-artifacts/
            qa/selenium/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show application logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 app
      - name: Stop isolated test stack
        if: always()
        run: docker compose down --volumes
